<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">C14 — Weekly Letter</title><desc id="desc">yikes! Soft Pop mobile app screen. Editable vector shapes and typography.</desc>
<defs>
 <linearGradient id="emberGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D67C62"/><stop offset="1" stop-color="#B85842"/></linearGradient>
 <linearGradient id="blobGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4D38D"/><stop offset="1" stop-color="#DEA95C"/></linearGradient>
 <linearGradient id="lilacGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4C6E9"/><stop offset="1" stop-color="#A898CC"/></linearGradient>
 <linearGradient id="surfaceGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFCF7"/><stop offset="1" stop-color="#F1E9DF"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#30212A" flood-opacity="0.08"/></filter>
 <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
<rect width="390" height="844" rx="34" fill="#F7F1E9"/>

<rect x="0" y="0" width="390" height="844" rx="34" fill="#F7F1E9" />
<text x="24" y="25" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">9:41</tspan></text>
<path d="M313 20 Q319 14 325 20" fill="none" stroke="#29232B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M315 23 Q319 19 323 23" fill="none" stroke="#29232B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="319" cy="26" r="1.4" fill="#29232B"/>
<rect x="334" y="17" width="17" height="10" rx="2" fill="none" stroke="#29232B" stroke-width="1" />
<rect x="336" y="19" width="9" height="6" rx="0" fill="#29232B" />
<rect x="352" y="20" width="2" height="4" rx="0" fill="#29232B" />
<path d="M32 51 L24 59 L32 67" fill="none" stroke="#29232B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M25 59 H43" fill="none" stroke="#29232B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="24" y="75" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#C8664D" text-anchor="start" letter-spacing="1.2"><tspan x="24" dy="0">A LETTER FROM YOUR COACH</tspan></text>
<g transform="translate(292 92) scale(0.56)">
<circle cx="50" cy="51" r="47" fill="#5A3F3A" opacity="0.05"/>
<path d="M50 5 C69 3 86 16 92 34 C99 53 90 75 74 87 C59 98 36 95 20 84 C4 73 1 53 8 34 C14 17 31 7 50 5 Z" fill="url(#blobGrad)" filter="url(#shadow)"/>
<path d="M25 21 C34 12 47 10 57 13" fill="none" stroke="#FFF8E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.62" />
<path d="M27 42 Q33 34 39 42" fill="none" stroke="#29232B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M60 42 Q66 34 72 42" fill="none" stroke="#29232B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M39 59 Q51 72 64 57" fill="none" stroke="#6E4039" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
</g>
<text x="24" y="134" font-family="'Instrument Serif', 'Georgia', serif" font-size="27" font-weight="400" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">Dear you,</tspan></text>
<text x="24" y="191" font-family="'Instrument Serif', 'Georgia', serif" font-size="15" font-weight="400" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">This week, you kept a conversation moving by</tspan><tspan x="24" dy="24">asking a follow-up instead of planning your</tspan><tspan x="24" dy="24">next sentence.</tspan></text>
<text x="24" y="285" font-family="'Instrument Serif', 'Georgia', serif" font-size="15" font-weight="400" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">One pattern worth noticing: one-to-one</tspan><tspan x="24" dy="24">conversations seem to give you more room to</tspan><tspan x="24" dy="24">ask questions than groups do.</tspan></text>
<text x="24" y="379" font-family="'Instrument Serif', 'Georgia', serif" font-size="15" font-weight="400" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">For next week, try one small follow-up in a</tspan><tspan x="24" dy="24">group. Nothing bigger than that.</tspan></text>
<path d="M24 570 L366 570" fill="none" stroke="#E5DACE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="24" y="601" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="700" fill="#C8664D" text-anchor="start" letter-spacing="0.7"><tspan x="24" dy="0">One focus for next week</tspan></text>
<text x="24" y="628" font-family="'Instrument Serif', 'Georgia', serif" font-size="17" font-weight="400" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">Ask one follow-up in a group, then</tspan><tspan x="24" dy="22">notice what happens.</tspan></text>
<rect x="24" y="730" width="342" height="52" rx="26" fill="url(#emberGrad)" filter="url(#shadow)"/>
<text x="195.0" y="762" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="650" fill="#FFFFFF" text-anchor="middle" letter-spacing="0"><tspan x="195.0" dy="0">Plan it</tspan></text>
<text x="195" y="818" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="400" fill="#776D72" text-anchor="middle" letter-spacing="0"><tspan x="195" dy="0">You can turn off Weekly Letters in settings.</tspan></text>
</svg>