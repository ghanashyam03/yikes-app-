<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">C11 — Reply Helper</title><desc id="desc">yikes! Soft Pop mobile app screen. Editable vector shapes and typography.</desc>
<defs>
 <linearGradient id="emberGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D67C62"/><stop offset="1" stop-color="#B85842"/></linearGradient>
 <linearGradient id="blobGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4D38D"/><stop offset="1" stop-color="#DEA95C"/></linearGradient>
 <linearGradient id="lilacGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4C6E9"/><stop offset="1" stop-color="#A898CC"/></linearGradient>
 <linearGradient id="surfaceGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFCF7"/><stop offset="1" stop-color="#F1E9DF"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#30212A" flood-opacity="0.08"/></filter>
 <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
<rect width="390" height="844" rx="34" fill="#F7F1E9"/>

<text x="24" y="25" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">9:41</tspan></text>
<path d="M313 20 Q319 14 325 20" fill="none" stroke="#29232B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M315 23 Q319 19 323 23" fill="none" stroke="#29232B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="319" cy="26" r="1.4" fill="#29232B"/>
<rect x="334" y="17" width="17" height="10" rx="2" fill="none" stroke="#29232B" stroke-width="1" />
<rect x="336" y="19" width="9" height="6" rx="0" fill="#29232B" />
<rect x="352" y="20" width="2" height="4" rx="0" fill="#29232B" />
<path d="M32 51 L24 59 L32 67" fill="none" stroke="#29232B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M25 59 H43" fill="none" stroke="#29232B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="58" y="61" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#C8664D" text-anchor="start" letter-spacing="1.0"><tspan x="58" dy="0">REPLY HELPER</tspan></text>
<text x="24" y="84" font-family="'Instrument Serif', 'Georgia', serif" font-size="30" font-weight="400" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">A reply that sounds</tspan><tspan x="24" dy="33.0">like you.</tspan></text>
<text x="24" y="158.0" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">We can suggest possibilities, not know what the</tspan><tspan x="24" dy="16">sender meant.</tspan></text>
<rect x="24" y="204" width="342" height="42" rx="21" fill="#EDE6F5" />
<text x="110" y="230" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="650" fill="#29232B" text-anchor="middle" letter-spacing="0"><tspan x="110" dy="0">Paste a message</tspan></text>
<rect x="199" y="204" width="157" height="42" rx="21" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<text x="277" y="230" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="600" fill="#29232B" text-anchor="middle" letter-spacing="0"><tspan x="277" dy="0">Upload screenshot</tspan></text>
<rect x="24" y="262" width="342" height="100" rx="16" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<text x="40" y="290" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="400" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">“Sounds good, let’s talk later.”</tspan></text>
<text x="40" y="343" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">Paste message text…</tspan></text>
<rect x="24" y="382" width="342" height="95" rx="20" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" filter="url(#shadow)"/>
<circle cx="346" cy="402" r="4" fill="#B9A8D9"/>
<text x="40" y="407" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="650" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">WHAT THEY MAY MEAN</tspan></text>
<text x="40" y="427" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10.5" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">They might be busy and want to reconnect later — or</tspan><tspan x="40" dy="14">they may be keeping the exchange brief. I can’t know</tspan><tspan x="40" dy="14">which.</tspan></text>
<text x="24" y="504" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#C8664D" text-anchor="start" letter-spacing="1"><tspan x="24" dy="0">THREE REPLY OPTIONS</tspan></text>
<rect x="24" y="520" width="342" height="58" rx="20" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" filter="url(#shadow)"/>
<circle cx="346" cy="540" r="4" fill="#AFCDB8"/>
<text x="40" y="545" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11.5" font-weight="650" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">WARM</tspan></text>
<text x="40" y="560" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9.5" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">“Sure — what time works for you?”</tspan></text>
<rect x="24" y="587" width="342" height="58" rx="20" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" filter="url(#shadow)"/>
<circle cx="346" cy="607" r="4" fill="#B9A8D9"/>
<text x="40" y="612" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11.5" font-weight="650" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">DIRECT</tspan></text>
<text x="40" y="627" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9.5" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">“Okay, send me a time that suits.”</tspan></text>
<rect x="24" y="694" width="342" height="52" rx="26" fill="url(#emberGrad)" filter="url(#shadow)"/>
<text x="195.0" y="726" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="650" fill="#FFFFFF" text-anchor="middle" letter-spacing="0"><tspan x="195.0" dy="0">Copy warm reply</tspan></text>
</svg>