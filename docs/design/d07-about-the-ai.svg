<text x="40" y="569" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10.5" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">Not therapy, diagnosis or medical advice.</tspan></text>
