<text x="40" y="476" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10.5" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">Feedback based on your conversation. It can be wrong;</tspan><tspan x="40" dy="14">you can say so.</tspan></text>
