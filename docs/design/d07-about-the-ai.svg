<text x="40" y="269" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="650" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">SIMULATED CHARACTERS</tspan></text>
<text x="40" y="288" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">The partners are fictional and never claim to be human.</tspan></text>
