<text x="40" y="379" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10.5" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">Shows what a character was written to think — not what</tspan><tspan x="40" dy="14">a real person thinks.</tspan></text>
<rect x="24" y="431" width="342" height="83" rx="20" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" filter="url(#shadow)"/>
<circle cx="346" cy="451" r="4" fill="#AFCDB8"/>
