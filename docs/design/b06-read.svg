<path d="M25 59 H43" fill="none" stroke="#29232B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="58" y="61" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#C8664D" text-anchor="start" letter-spacing="1.0"><tspan x="58" dy="0">READ · DIFFERENT PEOPLE, DIFFERENT SIGNALS</tspan></text>
<text x="24" y="84" font-family="'Instrument Serif', 'Georgia', serif" font-size="30" font-weight="400" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">What is Maya thinking?</tspan></text>
<text x="24" y="125.0" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">Choose the most plausible thought for this scene.</tspan></text>
<rect x="24" y="212" width="342" height="71" rx="20" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" filter="url(#shadow)"/>
<circle cx="346" cy="232" r="4" fill="#B9A8D9"/>
<text x="40" y="237" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="650" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">MAYA</tspan></text>
<text x="40" y="254" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">“Oh, I see. Yeah, that makes sense.”</tspan></text>
<rect x="24" y="304" width="342" height="72" rx="17" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<circle cx="49" cy="330" r="14" fill="#EDE6F5"/>
<text x="49" y="334" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="700" fill="#29232B" text-anchor="middle" letter-spacing="0"><tspan x="49" dy="0">A</tspan></text>
<text x="74" y="329" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="500" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="74" dy="0">She is being polite; she may be ready to move</tspan><tspan x="74" dy="15">on.</tspan></text>
<rect x="24" y="392" width="342" height="72" rx="17" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<circle cx="49" cy="418" r="14" fill="#EDE6F5"/>
<text x="49" y="422" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="700" fill="#29232B" text-anchor="middle" letter-spacing="0"><tspan x="49" dy="0">B</tspan></text>
<text x="74" y="417" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="500" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="74" dy="0">She definitely thinks you are boring.</tspan></text>
<rect x="24" y="480" width="342" height="72" rx="17" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<circle cx="49" cy="506" r="14" fill="#EDE6F5"/>
<text x="49" y="510" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="700" fill="#29232B" text-anchor="middle" letter-spacing="0"><tspan x="49" dy="0">C</tspan></text>
<text x="74" y="505" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="500" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="74" dy="0">She wants to share a long story.</tspan></text>
<rect x="24" y="578" width="342" height="65" rx="20" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" filter="url(#shadow)"/>
<circle cx="346" cy="598" r="4" fill="#E6C278"/>
<text x="40" y="603" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11.5" font-weight="650" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">REMEMBER</tspan></text>
<text x="40" y="620" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">A short reply is one cue, not proof of what someone feels.</tspan></text>
<rect x="24" y="708" width="342" height="52" rx="26" fill="url(#emberGrad)" filter="url(#shadow)"/>
<text x="195.0" y="740" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="650" fill="#FFFFFF" text-anchor="middle" letter-spacing="0"><tspan x="195.0" dy="0">Reveal thought</tspan></text>
