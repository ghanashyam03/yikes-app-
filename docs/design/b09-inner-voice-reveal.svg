<text x="58" y="464" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">“It’s been fun working with them.”</tspan></text>
