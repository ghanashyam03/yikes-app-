<text x="40" y="268" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">You gave Maya a useful opening by asking about her</tspan><tspan x="40" dy="15">side of the conversation, too.</tspan></text>
