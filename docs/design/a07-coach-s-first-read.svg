<text x="40" y="530" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">“What do you enjoy most about your team?” A small</tspan><tspan x="40" dy="15">follow-up creates room.</tspan></text>
