<text x="88" y="363" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="88" dy="0">“I finished the data review. Next I’m checking</tspan><tspan x="88" dy="13">edge cases.”</tspan></text>
<rect x="24" y="406" width="273" height="79" rx="20" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" filter="url(#shadow)"/>
