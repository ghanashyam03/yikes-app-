<text x="40" y="450" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">“Great — what might block the release?”</tspan></text>
<text x="24" y="522" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#C8664D" text-anchor="start" letter-spacing="1"><tspan x="24" dy="0">SUGGESTED REPLIES</tspan></text>
<rect x="24" y="540" width="342" height="32" rx="16" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<text x="195" y="560" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="600" fill="#29232B" text-anchor="middle" letter-spacing="0"><tspan x="195" dy="0">Name one risk and next step</tspan></text>
<rect x="24" y="580" width="342" height="32" rx="16" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<text x="195" y="600" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="600" fill="#29232B" text-anchor="middle" letter-spacing="0"><tspan x="195" dy="0">Ask which risk matters most</tspan></text>
<rect x="24" y="620" width="342" height="32" rx="16" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<text x="195" y="640" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="600" fill="#29232B" text-anchor="middle" letter-spacing="0"><tspan x="195" dy="0">Write my own</tspan></text>
<rect x="24" y="668" width="342" height="40" rx="20" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<text x="40" y="693" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">Write a response…</tspan></text>
