<text x="338" y="692" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0"><tspan x="338" dy="0">↑</tspan></text>
