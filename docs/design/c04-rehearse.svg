<text x="40" y="273" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">“Can you give me a quick update on your</tspan><tspan x="40" dy="13">part?”</tspan></text>
