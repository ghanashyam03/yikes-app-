<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">A10 — Email or phone entry</title><desc id="desc">yikes! Soft Pop mobile app screen. Editable vector shapes and typography.</desc>
<defs>
 <linearGradient id="emberGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D67C62"/><stop offset="1" stop-color="#B85842"/></linearGradient>
 <linearGradient id="blobGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4D38D"/><stop offset="1" stop-color="#DEA95C"/></linearGradient>
 <linearGradient id="lilacGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4C6E9"/><stop offset="1" stop-color="#A898CC"/></linearGradient>
 <linearGradient id="surfaceGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFCF7"/><stop offset="1" stop-color="#F1E9DF"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#30212A" flood-opacity="0.08"/></filter>
 <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
<rect width="390" height="844" rx="34" fill="#F7F1E9"/>

<text x="24" y="25" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">9:41</tspan></text>
<path d="M313 20 Q319 14 325 20" fill="none" stroke="#29232B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M315 23 Q319 19 323 23" fill="none" stroke="#29232B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="319" cy="26" r="1.4" fill="#29232B"/>
<rect x="334" y="17" width="17" height="10" rx="2" fill="none" stroke="#29232B" stroke-width="1" />
<rect x="336" y="19" width="9" height="6" rx="0" fill="#29232B" />
<rect x="352" y="20" width="2" height="4" rx="0" fill="#29232B" />
<path d="M32 51 L24 59 L32 67" fill="none" stroke="#29232B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M25 59 H43" fill="none" stroke="#29232B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="58" y="61" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#C8664D" text-anchor="start" letter-spacing="1.0"><tspan x="58" dy="0">PASSWORDLESS SIGN-IN</tspan></text>
<text x="24" y="84" font-family="'Instrument Serif', 'Georgia', serif" font-size="30" font-weight="400" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">Where should we send</tspan><tspan x="24" dy="33.0">your code?</tspan></text>
<text x="24" y="158.0" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">A six-digit code expires after 10 minutes.</tspan></text>
<text x="24" y="235" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#C8664D" text-anchor="start" letter-spacing="1.0"><tspan x="24" dy="0">EMAIL ADDRESS</tspan></text>
<rect x="24" y="251" width="342" height="58" rx="14" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<text x="42" y="286" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="42" dy="0">you@example.com</tspan></text>
<text x="24" y="335" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">We’ll open your email app from the button when possible.</tspan></text>
<rect x="24" y="396" width="342" height="52" rx="26" fill="url(#emberGrad)" filter="url(#shadow)"/>
<text x="195.0" y="428" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="650" fill="#FFFFFF" text-anchor="middle" letter-spacing="0"><tspan x="195.0" dy="0">Send code</tspan></text>
<text x="195" y="484" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="500" fill="#776D72" text-anchor="middle" letter-spacing="0"><tspan x="195" dy="0">Prefer another method?</tspan></text>
<rect x="24" y="510" width="342" height="48" rx="24" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<text x="195" y="540" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="600" fill="#29232B" text-anchor="middle" letter-spacing="0"><tspan x="195" dy="0">Switch to phone</tspan></text>
