<path d="M313 20 Q319 14 325 20" fill="none" stroke="#29232B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M315 23 Q319 19 323 23" fill="none" stroke="#29232B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="319" cy="26" r="1.4" fill="#29232B"/>
<rect x="334" y="17" width="17" height="10" rx="2" fill="none" stroke="#29232B" stroke-width="1" />
<rect x="336" y="19" width="9" height="6" rx="0" fill="#29232B" />
<rect x="352" y="20" width="2" height="4" rx="0" fill="#29232B" />
<path d="M32 51 L24 59 L32 67" fill="none" stroke="#29232B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M25 59 H43" fill="none" stroke="#29232B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="58" y="61" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#C8664D" text-anchor="start" letter-spacing="1.0"><tspan x="58" dy="0">YOUR COACH</tspan></text>
<text x="24" y="84" font-family="'Instrument Serif', 'Georgia', serif" font-size="30" font-weight="400" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">There was a useful</tspan><tspan x="24" dy="33.0">opening.</tspan></text>
<text x="24" y="158.0" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">Specific moments, not a score.</tspan></text>
<rect x="24" y="207" width="342" height="125" rx="20" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" filter="url(#shadow)"/>
<circle cx="346" cy="227" r="4" fill="#AFCDB8"/>
<text x="40" y="232" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="650" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">WHAT WORKED</tspan></text>
<text x="40" y="255" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">“What did you learn from them?” You followed the</tspan><tspan x="40" dy="15">topic she was already interested in.</tspan></text>
<rect x="24" y="347" width="342" height="137" rx="20" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" filter="url(#shadow)"/>
<circle cx="346" cy="367" r="4" fill="#E6C278"/>
<text x="40" y="372" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="650" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">A PIVOT MOMENT</tspan></text>
<text x="40" y="395" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">You could make the next turn easier by asking one</tspan><tspan x="40" dy="15">concrete question: “What surprised you most?”</tspan></text>
<rect x="24" y="499" width="342" height="93" rx="20" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" filter="url(#shadow)"/>
<circle cx="346" cy="519" r="4" fill="#B9A8D9"/>
<text x="40" y="524" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="650" fill="#29232B" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">TRY THIS NEXT TIME</tspan></text>
<text x="40" y="544" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10.5" font-weight="400" fill="#776D72" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">Let the other person’s excitement set the next</tspan><tspan x="40" dy="14">question.</tspan></text>
<rect x="24" y="620" width="160" height="52" rx="26" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<text x="104.0" y="652" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="650" fill="#29232B" text-anchor="middle" letter-spacing="0"><tspan x="104.0" dy="0">Rewind</tspan></text>
<rect x="206" y="620" width="160" height="52" rx="26" fill="#FFFCF7" stroke="#E5DACE" stroke-width="1" />
<text x="286.0" y="652" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="650" fill="#29232B" text-anchor="middle" letter-spacing="0"><tspan x="286.0" dy="0">See Maya’s thoughts</tspan></text>
